[project]
name = "officelog"
version = "0.1.0"
description = "Workplace attendance MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.163.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
