# Local run with Docker: `docker compose up --build`, then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: officelog
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/officelog
      APP_DB_PASSWORD: local-dev-app-password
      # Local only. Use your own long random string anywhere real.
      MASTER_SECRET: local-dev-master-secret-not-for-production
      BASE_URL: http://localhost:8000
      COOKIE_SECURE: "false"
volumes:
  pgdata:
